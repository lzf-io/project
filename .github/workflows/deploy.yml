name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install MkDocs Material
        run: |
          pip install mkdocs-material
      
      - name: Build stripe-billing docs
        working-directory: stripe-billing
        run: |
          mkdocs build --site-dir ../site/stripe-billing
      
      - name: Build product-creation-system docs
        working-directory: product-creation-system
        run: |
          mkdocs build --site-dir ../site/product-creation-system
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
